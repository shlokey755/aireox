<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050308" />
    <title>Happy Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="star" viewBox="0 0 20 20">
        <path d="M10 0L12.5 7.5L20 10L12.5 12.5L10 20L7.5 12.5L0 10L7.5 7.5Z" />
      </symbol>
      <symbol id="heart" viewBox="0 0 100 100">
        <path d="M50 90L14 52A21.1 21.1 0 0 1 50 30A21.1 21.1 0 0 1 86 52Z" />
      </symbol>
    </svg>

    <canvas id="sky" aria-hidden="true"></canvas>

    <main>
      <header class="hero" id="hero">
        <p class="tag" id="forName"></p>
        <h1 class="big" data-split aria-label="Happy Birthday"><span>Happy</span><span>Birthday</span></h1>
        <p class="sub">a tiny universe made only for you</p>
        <p class="cue">scroll slowly</p>
        <span class="chev" aria-hidden="true"></span>
      </header>

      <div class="marquee"><div class="track" data-text="happy birthday"></div></div>

      <section class="memories" id="memories" aria-label="Memories"></section>

      <div class="zig" aria-hidden="true"></div>

      <section class="note" id="note">
        <h2 class="head pop">a little note</h2>
      </section>

      <div class="marquee b"><div class="track" data-text="you are my favourite"></div></div>

      <section class="loves" id="loves">
        <h2 class="head pop">things you love</h2>
        <div class="collage">
          <figure class="tile t-moon pop" style="--d: 0ms" data-art="moon"><figcaption>the moon</figcaption></figure>
          <figure class="tile t-flower pop" style="--d: 120ms" data-art="flower"><figcaption>Rapunzel's flower</figcaption></figure>
          <figure class="tile t-pizza pop" style="--d: 240ms" data-art="pizza"><figcaption>pizza</figcaption></figure>
          <figure class="tile t-black pop" style="--d: 0ms" data-art="black"><figcaption>black, always</figcaption></figure>
          <figure class="tile t-tangled pop" style="--d: 120ms" data-art="tangled"><figcaption>Tangled</figcaption></figure>
          <figure class="tile t-hearts pop" style="--d: 0ms" data-art="hearts"><figcaption>us</figcaption></figure>
          <figure class="tile t-words pop" style="--d: 120ms"><p>all of it, always</p></figure>
        </div>
      </section>

      <div class="zig" aria-hidden="true"></div>

      <section class="finale" id="finale">
        <div class="cake" id="cake"></div>
        <h2 class="big small pop" aria-label="Happy Birthday"><span>Happy</span><span>Birthday</span></h2>
        <p class="from" id="from"></p>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
